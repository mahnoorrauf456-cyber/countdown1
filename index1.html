<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mohib ❤️ Mahnoor</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#fff8fb,#ffe4ec,#fff);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

/* Floating Hearts */
body::before{
    content:"💕 🤍 💖 💗";
    position:absolute;
    left:10%;
    top:100%;
    font-size:30px;
    opacity:.25;
    animation:float 18s linear infinite;
}

body::after{
    content:"🤍 💕 💖";
    position:absolute;
    right:10%;
    top:100%;
    font-size:30px;
    opacity:.25;
    animation:float 22s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-130vh);
    }
}

.container{
    width:90%;
    max-width:900px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
    border-radius:25px;
    padding:50px 30px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:65px;
    color:#d63384;
    margin-bottom:10px;
}

h2{
    color:#c2185b;
    margin-bottom:20px;
    font-size:30px;
}

.quote{
    color:#666;
    font-size:20px;
    line-height:1.8;
    margin-bottom:15px;
    font-style:italic;
}

.hash{
    color:#e91e63;
    font-size:22px;
    font-weight:600;
    margin-bottom:40px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.box{
    width:130px;
    height:130px;
    background:white;
    border-radius:20px;
    border:2px solid #ffd2df;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:.3s;
}

.box:hover{
    transform:translateY(-8px);
    background:#fff1f6;
}

.number{
    font-size:46px;
    font-weight:bold;
    color:#d63384;
}

.label{
    color:#666;
    font-size:18px;
}

.date{
    margin-top:40px;
    font-size:24px;
    color:#b0005a;
    font-weight:bold;
}

@media(max-width:700px){

h1{
font-size:48px;
}

h2{
font-size:24px;
}

.quote{
font-size:17px;
}

.box{
width:100px;
height:100px;
}

.number{
font-size:34px;
}

}
</style>

</head>

<body>

<div class="container">

<h1>Mohib ❤️ Mahnoor</h1>

<h2>⏳ Our Forever Begins In...</h2>

<div class="quote">
"Every second brings us closer to the moment Allah has written for us. 🤍⏳"
</div>

<div class="hash">
❤️ #MahnoorFoundMohib ❤️
</div>

<div class="countdown">

<div class="box">
<div class="number" id="days">00</div>
<div class="label">Days</div>
</div>

<div class="box">
<div class="number" id="hours">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div class="number" id="minutes">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div class="number" id="seconds">00</div>
<div class="label">Seconds</div>
</div>

</div>

<div class="date">
20 September 2026
</div>

</div>

<script>

const weddingDate = new Date("September 20, 2026").getTime();

const countdown = setInterval(function(){

const now = new Date().getTime();
const distance = weddingDate - now;

const days = Math.floor(distance / (1000*60*60*24));
const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
const seconds = Math.floor((distance % (1000*60)) / 1000);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

if(distance < 0){

clearInterval(countdown);

document.querySelector(".container").innerHTML=`
<h1>💍 Alhamdulillah! 💍</h1>
<h2>Today is Our Wedding Day!</h2>
<div class="quote">
May Allah bless our marriage with endless love, mercy and happiness. 🤍
</div>
<div class="hash">
❤️ #MahnoorFoundMohib ❤️
</div>
`;

}

},1000);

</script>

</body>
</html>
